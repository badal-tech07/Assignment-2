<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>College Admission Form</title>
</head>
<body>

    <h1>College Admission Registration Form</h1>

    <p>Please fill in the details below to apply for admission.</p>

    <form>

        <fieldset>
            <legend>Personal Information</legend>

            <label>Full Name:</label><br>
            <input type="text" name="fullname"
                   placeholder="Enter your name" required>
            <br><br>

            <label>Email:</label><br>
            <input type="email" name="email"
                   placeholder="Enter your email" required>
            <br><br>

            <label>Phone Number:</label><br>
            <input type="tel" name="phone"
                   placeholder="Enter phone number" required>
            <br><br>

            <label>Date of Birth:</label><br>
            <input type="date" name="dob" required>
            <br><br>

            <label>Password:</label><br>
            <input type="password" name="password"
                   minlength="6" required>
            <br><br>

            <label>Gender:</label><br>

            <input type="radio" name="gender" value="Male" required>
            Male

            <input type="radio" name="gender" value="Female">
            Female

            <input type="radio" name="gender" value="Other">
            Other

        </fieldset>

        <br>

        <fieldset>
            <legend>Academic Details</legend>

            <label>Select Your Course:</label><br>

            <select name="course" required>
                <option value="">--Select Course--</option>
                <option value="B.Tech CSE">B.Tech CSE</option>
                <option value="B.Tech AI/ML">B.Tech AI/ML</option>
                <option value="BBA">BBA</option>
                <option value="BCA">BCA</option>
            </select>

            <br><br>

            <label>Your Interests:</label><br>

            <input type="checkbox" name="interest" value="Coding">
            Coding

            <input type="checkbox" name="interest" value="Sports">
            Sports

            <input type="checkbox" name="interest" value="Music">
            Music

            <input type="checkbox" name="interest" value="Reading">
            Reading

            <br><br>

            <label>Address:</label><br>

            <textarea name="address" rows="4" cols="35"
            placeholder="Enter your full address"></textarea>

        </fieldset>

        <br>

        <fieldset>
            <legend>Upload Documents</legend>

            <label>Upload Photograph:</label><br>
            <input type="file" name="photo" accept="image/*" required>

            <br><br>

            <label>Upload Supporting Documents:</label><br>
            <input type="file" name="documents" required>

        </fieldset>

        <br>

        <input type="checkbox" name="declaration" required>
        I confirm that the information provided is correct.

        <br><br>

        <input type="submit" value="Submit">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
